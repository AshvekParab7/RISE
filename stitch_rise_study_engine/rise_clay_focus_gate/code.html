<style>
        .clay-inflated {
            box-shadow: inset 4px 4px 12px rgba(255, 255, 255, 0.9),
                        inset -8px -8px 16px rgba(0, 0, 0, 0.04),
                        30px 30px 60px rgba(168, 178, 177, 0.35);
        }

        }

                        inset -2px -2px 6px rgba(255, 255, 255, 0.6);

            animation: pulse-ring-anim 4s cubic-bezier(0.4, 0, 0.6, 1) infinite;

            0% { transform: scale(0.95); opacity: 0; }

        .progress-ring__circle {
            transition: stroke-dashoffset 1s linear;

<body class="bg-surface-container-high h-screen w-screen overflow-hidden flex flex-col items-center justify-center relative font-body-md text-on-surface">
<!-- Subtle Background Elements -->
<div class="absolute inset-0 z-0 overflow-hidden pointer-events-none">
<div class="absolute top-[-10%] left-[-10%] w-[50vw] h-[50vw] rounded-full bg-surface-lowest opacity-40 blur-3xl mix-blend-overlay"></div>
<div class="absolute bottom-[-10%] right-[-10%] w-[60vw] h-[60vw] rounded-full bg-secondary-fixed opacity-30 blur-3xl mix-blend-overlay"></div>
</div>
<!-- Main Content Canvas -->
<main class="z-10 flex flex-col items-center justify-center w-full max-w-4xl px-container-padding gap-section-margin">
<!-- Header -->
<header class="flex flex-col items-center gap-unit text-center">
<div class="flex items-center gap-2 text-primary">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">psychology</span>
<span class="font-label-md text-label-md uppercase tracking-widest text-on-surface-variant">Deep Focus Session</span>
</div>
<h1 class="font-headline-lg-mobile md:font-headline-lg text-headline-lg-mobile md:text-headline-lg text-primary">Quantum Mechanics</h1>
</header>
<!-- Timer Assembly -->
<div class="relative w-[320px] h-[320px] md:w-[480px] md:h-[480px] flex items-center justify-center">
<!-- Animated Pulse Background -->
<div class="absolute inset-0 rounded-full bg-surface-container-lowest pulse-ring z-0"></div>
<!-- Outer Inflated Ring (The Base) -->
<div class="absolute inset-4 rounded-full bg-surface-container-lowest clay-inflated z-10 flex items-center justify-center">
<!-- SVG Progress Track -->
<svg class="absolute inset-0 w-full h-full p-6 pointer-events-none z-20" viewBox="0 0 100 100">
<!-- Background recessed track -->
<circle class="text-surface-variant stroke-current" cx="50" cy="50" fill="transparent" r="44" stroke-width="6" style="filter: drop-shadow(inset 2px 2px 4px rgba(0,0,0,0.1));"></circle>
<!-- Active progress slug -->
<circle class="text-primary-container stroke-current progress-ring__circle" cx="50" cy="50" fill="transparent" id="progressCircle" r="44" stroke-dasharray="276.46" stroke-dashoffset="0" stroke-linecap="round" stroke-width="6" style="filter: drop-shadow(rgba(168, 178, 177, 0.5) 2px 4px 6px); stroke-dashoffset: 4.91485;"></circle>
</svg>
<!-- Inner Recessed Well -->
<div class="w-[200px] h-[200px] md:w-[300px] md:h-[300px] rounded-full bg-surface-container clay-recessed z-30 flex flex-col items-center justify-center relative overflow-hidden">
<!-- Time Display -->
<div class="flex flex-col items-center">
<span class="font-display-lg text-display-lg text-primary tracking-tight" id="timeDisplay" style="font-variant-numeric: tabular-nums;">44:12</span>
<span class="font-label-md text-label-md text-on-surface-variant mt-2">Remaining</span>
</div>
<!-- Subtle internal shadow for extra depth -->
<div class="absolute inset-0 rounded-full shadow-[inset_0_10px_20px_rgba(0,0,0,0.02)] pointer-events-none"></div>
</div>
</div>
</div>

<span class="material-symbols-outlined text-[20px]">close</span>
                Quit Session
            </button>
</div>
</main>
<script>
        // Simple timer logic for visual effect
        document.addEventListener('DOMContentLoaded', () => {
            const timeDisplay = document.getElementById('timeDisplay');
            const progressCircle = document.getElementById('progressCircle');
            
            let totalSeconds = 45 * 60;
            let currentSeconds = totalSeconds;
            
            // SVG Circle Math
            const radius = progressCircle.r.baseVal.value;
            const circumference = radius * 2 * Math.PI;
            progressCircle.style.strokeDasharray = `${circumference} ${circumference}`;
            progressCircle.style.strokeDashoffset = 0;

            function updateDisplay() {
                const minutes = Math.floor(currentSeconds / 60);
                const seconds = currentSeconds % 60;
                timeDisplay.textContent = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
                
                const offset = circumference - (currentSeconds / totalSeconds) * circumference;
                progressCircle.style.strokeDashoffset = offset;
            }

            // Simulate countdown
            setInterval(() => {
                if(currentSeconds > 0) {
                    currentSeconds--;
                    updateDisplay();
                }
            }, 1000);
        });
    </script>
